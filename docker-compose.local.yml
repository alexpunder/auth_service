name: auth_service

volumes:
  postgres-data-sarawan:
  redis-sarawan:

services:
  auth:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-sarawan
    hostname: auth
    env_file:
      - .env
    ports:
      - 5050:5050
    networks:
      - ecom-sarawan

  postgres-sarawan:
    image: postgres:16-alpine
    container_name: ecom-postgres-sarawan
    restart: always
    environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: 123
        POSTGRES_DB: ecom-backend
    ports:
      - 5432:5432
    volumes:
      - postgres-data-sarawan:/var/lib/postgresql/data
    networks:
      - ecom-sarawan

  redis-sarawan:
    image: redis:latest
    container_name: ecom-redis-sarawan
    restart: always
    command: redis-server --requirepass 123
    environment:
        REDIS_PASSWORD: 123
        REDIS_DATABASE: 0
    ports:
      - 6379:6379
    volumes:
      - /path/to/local/dаta:/root/redis
      - /path/to/local/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - ecom-sarawan

  zookeeper:
    image: confluentinc/cp-zookeeper:7.2.1
    hostname: zookeeper
    container_name: zookeeper-sarawan
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - ecom-sarawan

  kafka:
    image: confluentinc/cp-server:7.2.1
    hostname: kafka
    container_name: kafka-sarawan
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9997:9997"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONFLUENT_BALANCER_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9997
      KAFKA_JMX_HOSTNAME: kafka
    networks:
      - ecom-sarawan

  kafka-ui:
    container_name: kafka-ui-sarawan
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - 8082:8080
    environment:
      DYNAMIC_CONFIG_ENABLED: true
    networks:
      - ecom-sarawan

networks:
  ecom-sarawan:
    name: ecom-sarawan
    external: true
